parameters:
- name: enabled
  type: boolean
- name: path
  type: string
steps:
- task: PowerShell@2
  displayName: 'Checkout ${{ parameters.path }} Submodule'
  condition: and(succeeded(), ${{ parameters.enabled }})
  retryCountOnTaskFailure: 4
  inputs:
    pwsh: true
    filePath: azure-devops/checkout-submodule.ps1
    arguments: -submodule ${{ parameters.path }}
